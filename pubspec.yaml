name: flutter_application_1
description: "CareMatch - Find the right caregiver for your needs"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_svg: ^2.0.10
  http: ^1.2.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  file_picker: 10.3.10
  syncfusion_flutter_pdfviewer: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Quattrocento Sans
      fonts:
        - asset: assets/fonts/QuattrocentoSans-Regular.ttf
        - asset: assets/fonts/QuattrocentoSans-Bold.ttf
          weight: 700

# Run `dart run flutter_launcher_icons` after changing anything here to
# regenerate every Android mipmap size + iOS AppIcon.appiconset entry from
# the one source image, rather than hand-placing each size.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "#01452D"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
